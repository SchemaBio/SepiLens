name: Verify
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/openapi.py --check
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/sepilens
      - if: runner.os == 'Windows'
        run: python scripts/smoke.py --binary sepilens.exe --output tmp/ci-smoke.json --requests 8
      - if: runner.os == 'Linux'
        run: python scripts/smoke.py --binary sepilens --output tmp/ci-smoke.json --requests 8
      - if: runner.os == 'Linux'
        run: go test -race ./...
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
